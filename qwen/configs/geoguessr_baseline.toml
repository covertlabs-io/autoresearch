[project]
name = "qwen-geo-geoguessr"
output_root = "runs"
tracker_db = "runs/experiments.sqlite"
prepared_data_dir = "data/prepared"
reports_dir = "runs/reports"
seed = 17

[dataset]
name = "marcelomoreno26/geoguessr"
train_split = "train"
image_column = "image"
sample_limit = 12000
train_limit = 4096
eval_limit = 256
test_limit = 256
split_seed = 17
eval_fraction = 0.08
test_fraction = 0.02
geohash_precision = 4

[model]
backend = "unsloth"
name = "unsloth/Qwen3.5-2B-Base"
max_seq_length = 1536
load_in_4bit = false
use_gradient_checkpointing = true
max_image_size = 576
trust_remote_code = true

[lora]
r = 16
alpha = 16
dropout = 0.0
bias = "none"
finetune_vision_layers = true
finetune_language_layers = true
finetune_attention_modules = true
finetune_mlp_modules = true

[training]
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.0002
weight_decay = 0.01
warmup_ratio = 0.05
max_steps = 180
num_train_epochs = 1.0
time_budget_minutes = 20
logging_steps = 10
save_steps = 180
max_grad_norm = 1.0
lr_scheduler_type = "cosine"
num_proc = 1
bf16 = true
gradient_checkpointing = true
dataloader_num_workers = 2

[evaluation]
eval_examples = 128
max_new_tokens = 80
temperature = 0.0
top_p = 1.0
thresholds_km = [1, 25, 200, 750]

[autonomy]
hours = 12.0
max_trials = 36
min_score_delta = 0.002
promote_threshold = 0.01
planner_seed = 17

[search]
learning_rates = [0.0001, 0.0002, 0.0003]
lora_ranks = [8, 16, 32]
geohash_precisions = [3, 4, 5]
train_limits = [2048, 4096, 8192]
image_sizes = [448, 576, 672]
label_styles = ["full_json", "cell_json", "coords_json"]
prompt_styles = ["strict_json", "geohash_first", "coords_first"]
finetune_vision_layers = [true, false]
finetune_language_layers = [true, false]

label_style = "full_json"
prompt_style = "strict_json"
